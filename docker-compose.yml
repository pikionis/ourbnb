# Local development stack: PostgreSQL 16 + Django backend with hot reload.
# See ADR 0003 (PostgreSQL 16) and ADR 0010 (Docker Compose hosting).
# Production uses deploy/docker-compose.prod.yml (Phase 7), not this file.
#
#   make up     -> docker compose up
#   make down   -> docker compose down
#
# Compose reads the repo-root .env twice: for ${VAR} interpolation below, and
# (optionally) as env_file for the backend (DJANGO_SECRET_KEY, FERNET_KEYS, ...).
# Requires Docker Compose v2.24+ (env_file "required: false").

name: kospm

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kospm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kospm}
      POSTGRES_DB: ${POSTGRES_DB:-kospm}
    ports:
      # Host port 5433: 5432 is taken by the local Windows PostgreSQL service.
      # Bound to localhost only: the default password is not a secret.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation: the variables are expanded by the
      # shell inside the container, from the environment set above.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    # The image puts its virtualenv (/opt/venv) first on PATH, so plain
    # "python" is the project interpreter. runserver reloads on file changes.
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Overrides any DATABASE_URL from .env (which points at the host's
      # PostgreSQL): inside the network the database is "db" on port 5432.
      # A password with URL-special characters (@ : / ? #) must be %-encoded.
      DATABASE_URL: postgres://${POSTGRES_USER:-kospm}:${POSTGRES_PASSWORD:-kospm}@db:5432/${POSTGRES_DB:-kospm}
    volumes:
      # Bind mount for hot reload. The venv lives in /opt/venv, outside this
      # mount, so it is not hidden by it.
      - ./backend:/app
    ports:
      # DEBUG runserver: never expose it beyond this machine.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
