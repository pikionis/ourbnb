{% extends "portal/base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  <p class="lead">{% blocktranslate trimmed %}For the account <strong>{{ email }}</strong>.{% endblocktranslate %}</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "portal/form.html" with form=form %}
    <button type="submit" class="button">{% translate "Save the password" %}</button>
  </form>
{% endblock %}
