[project]
name = "kospm"
version = "0.1.0"
description = "KosPM: property management for short-term rentals on Kos (Django modular monolith, DDD + hexagonal)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web framework, ORM, admin and i18n (ADR 0002); 5.2 is the LTS line, 6.x is out of scope.
    "django>=5.2.18,<5.3",
    # 12-factor configuration: typed env vars, repo-root .env and DATABASE_URL parsing.
    "django-environ>=0.14",
    # Runtime support for generic subscripting (e.g. ModelAdmin[User]) required by strict mypy.
    "django-stubs-ext>=5.2.9,<5.3",
    # PostgreSQL driver (ADR 0003); the binary wheel needs no libpq install on Windows.
    "psycopg[binary]>=3.3",
    # Fernet encryption for guest ID numbers and lockbox codes (DOMAIN §2.3); used from Phase 1.
    "cryptography>=46",
    # IANA time zone database for zoneinfo("Europe/Athens"): Windows ships none.
    "tzdata>=2025.1",
    # Claude API: reads an owner's pasted listing text into a draft profile (Phase 2b,
    # ListingTextExtractor adapter; approved by Petros). 2.x is the SDK the adapter is written for.
    "anthropic>=2.3,<3",
    # iCalendar parsing of the platforms' calendar feeds (Phase 3, ICalParser adapter; named in
    # the BUILD_PLAN). 7.x is the API the parser is written for.
    "icalendar>=7.3,<8",
    # HTTP client of the iCal fetcher (timeout, ETag). Already installed with the Claude SDK;
    # declared because the fetcher uses it directly (Phase 3, approved by Petros).
    "httpx2>=2.16,<3",
    # The production web server (ADR 0010, 0022): gthread workers behind Caddy.
    "gunicorn>=26.2,<27",
]

[dependency-groups]
dev = [
    # Django type stubs + mypy plugin; the extra pins a mypy version the stubs are tested with.
    "django-stubs[compatible-mypy]>=5.2.9,<5.3",
    # Test runner (unit, integration, e2e).
    "pytest>=9",
    # Django test database, client and settings integration for pytest.
    "pytest-django>=4.14",
    # Linter and formatter (replaces flake8, isort, black).
    "ruff>=0.17",
    # Enforces the architecture's dependency rules (CLAUDE.md) as import contracts.
    "import-linter>=2.15",
    # Import graph for the transitive purity check in tests/unit/test_architecture.py
    # (import-linter's own engine, used directly by that test).
    "grimp>=3.17,<4",
]

[build-system]
# uv's own build backend: the package lives in src/kospm and is installed editable by `uv sync`.
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]
extend-exclude = ["**/migrations/**"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "DTZ",  # flake8-datetimez: no naive datetimes
    "DJ",   # flake8-django
    "TID",  # flake8-tidy-imports: absolute imports only + banned APIs below
    "RUF",  # ruff-specific rules
]
ignore = [
    # Domain exceptions are named in the ubiquitous language (DOMAIN.md §3, BUILD_PLAN), e.g.
    # PropertyNotReadyForActivation, OverlappingReservation, not "...Error".
    "N818",
]
# User-facing texts and test data are Greek (CLAUDE.md), so Greek letters that look Latin are
# expected in strings, docstrings and comments (RUF001-RUF003), not a homoglyph trick.
allowed-confusables = [
    "Α", "Β", "Ε", "Ζ", "Η", "Ι", "Κ", "Μ", "Ν", "Ο", "Ρ", "Τ", "Υ", "Χ",
    "α", "γ", "ι", "κ", "ν", "ο", "ρ", "σ", "τ", "υ", "χ",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules layer on top of base.py with `from config.settings.base import *`.
"config/settings/*.py" = ["F403", "F405"]
# The one place allowed to read the system clock (Phase 1).
"src/kospm/shared/clock.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["kospm", "config", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Inject a Clock (kospm.shared.clock)."
"datetime.datetime.utcnow".msg = "Inject a Clock (kospm.shared.clock)."
"datetime.datetime.today".msg = "Inject a Clock (kospm.shared.clock)."
"datetime.date.today".msg = "Use clock.today_athens()."
"django.utils.timezone.now".msg = "Inject a Clock (kospm.shared.clock)."
"time.time".msg = "Inject a Clock (kospm.shared.clock)."

# ---------------------------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "config", "tests", "manage.py"]
plugins = ["mypy_django_plugin.main"]
# Strict is GLOBAL on purpose: a per-module `strict` in an override silently applies everywhere,
# so never put `strict` in [[tool.mypy.overrides]]; relax specific flags there instead.
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[[tool.mypy.overrides]]
# Generated by Django.
module = ["kospm.*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# django-environ ships inline annotations but no py.typed marker: analyse them instead of
# degrading every env.str()/env.db() result to Any.
module = ["environ", "environ.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Test bodies are still type-checked (check_untyped_defs), annotations are optional.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.django-stubs]
# Must import with no .env and no database.
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = ["--ds=config.settings.test", "--strict-markers", "--strict-config", "-ra"]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL (auto-applied to tests/integration and tests/e2e)",
    "e2e: end-to-end through an entrypoint (auto-applied to tests/e2e)",
]

# ---------------------------------------------------------------------------------------------
# import-linter: the dependency rules of CLAUDE.md as contracts (`uv run lint-imports`)
# ---------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["kospm"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modular monolith: bootstrap > independent bounded contexts > shared kernel"
type = "layers"
containers = ["kospm"]
# `|` = independent siblings: bounded contexts never import each other (events + IDs only).
# `(x)` = optional: the context does not exist yet.
layers = [
    "(bootstrap)",
    "(properties) | (reservations) | (housekeeping) | (messaging) | (guests) | (local_guide) | (finance) | (compliance) | (owner_portal) | (identity)",
    "shared",
]
# Every top-level package of kospm must be listed above: a new context needs a deliberate decision.
exhaustive = true
# Entrypoints (API, commands) obtain the wired message bus from bootstrap. `**` needs at least one
# segment, so the entrypoints package itself is listed separately.
ignore_imports = [
    "kospm.*.entrypoints -> kospm.bootstrap",
    "kospm.**.entrypoints.** -> kospm.bootstrap",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Hexagonal layers inside every bounded context"
type = "layers"
# The outbox is a shared-kernel Django app laid out like a context (domain.py, service_layer/, ...).
containers = ["kospm.*", "kospm.shared.outbox"]
layers = ["(entrypoints)", "(adapters)", "(models)", "(service_layer)", "(domain)"]

[[tool.importlinter.contracts]]
name = "Domain is pure: stdlib + kospm.shared.domain + own domain only"
type = "forbidden"
source_modules = ["kospm.**.domain"]
forbidden_modules = [
    "django",
    "environ",
    "cryptography",
    "psycopg",
    "django_stubs_ext",
    "anthropic",
    "icalendar",
    "httpx2",
    "kospm.bootstrap",
    # Shared infrastructure: the domain receives time and money as values, never the machinery.
    "kospm.shared.clock",
    "kospm.shared.messagebus",
    "kospm.shared.unit_of_work",
    "kospm.shared.outbox",
    "kospm.shared.adapters",
    "kospm.**.service_layer",
    "kospm.**.adapters",
    "kospm.**.entrypoints",
    "kospm.**.models",
]

[[tool.importlinter.contracts]]
name = "Only adapters and bootstrap use the outside services' libraries"
type = "forbidden"
# Pages and models reach Claude and the calendar feeds through ports (ListingTextExtractor,
# ICalFetcher, ICalParser) that bootstrap wires: the indirect import through bootstrap is
# expected, a direct one is not.
source_modules = ["kospm.**.entrypoints", "kospm.**.models", "kospm.shared"]
forbidden_modules = ["anthropic", "icalendar", "httpx2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Service layer never touches Django, the ORM or adapters"
type = "forbidden"
# The shared bus, Unit of Work and Clock are service-layer machinery: pure Python as well.
source_modules = [
    "kospm.**.service_layer",
    "kospm.shared.messagebus",
    "kospm.shared.unit_of_work",
    "kospm.shared.clock",
]
forbidden_modules = [
    "django",
    "environ",
    "cryptography",
    "psycopg",
    "django_stubs_ext",
    "anthropic",
    "icalendar",
    "httpx2",
    "kospm.bootstrap",
    "kospm.shared.adapters",
    "kospm.**.adapters",
    "kospm.**.entrypoints",
    "kospm.**.models",
]
